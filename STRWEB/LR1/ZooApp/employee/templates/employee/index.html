<!DOCTYPE html>
<html>
<head>
    <title>Employees</title>
</head>
<body>
    <h1>Employees List</h1>
    <a href="{% url 'employee:create' %}">Add New Employee</a>
    
    <table border="1">
        <tr>
            <th>Name</th>
            <th>Position</th>
            <th>Email</th>
            <th>Actions</th>
        </tr>
        {% for employee in employees %}
        <tr>
            <td>{{ employee.name }}</td>
            <td>{{ employee.position }}</td>
            <td>{{ employee.email }}</td>
            <td>
                <a href="{% url 'employee:edit' employee.id %}">Edit</a>
                <a href="{% url 'employee:delete' employee.id %}" 
                   onclick="return confirm('Delete this employee?')">Delete</a>
            </td>
        </tr>
        {% endfor %}
    </table>
</body>
</html>
