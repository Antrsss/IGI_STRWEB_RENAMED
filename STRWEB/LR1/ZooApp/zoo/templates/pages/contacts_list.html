<h1>Contacts</h1>

{% for contact in contacts %}
    <div>
        {% if contact.photo %}
            <img src="{{ contact.photo.url }}" alt="{{ contact.name }}" width="150">
        {% endif %}
        <h3>{{ contact.name }} - {{ contact.position.name }}</h3>
        <p>{{ contact.info }}</p>
        <p>Phone: {{ contact.phone }}</p>
        <p>Email: {{ contact.email }}</p>
    </div>
    <hr>
{% endfor %}
