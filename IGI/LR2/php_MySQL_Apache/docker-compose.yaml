services:
  php:
    build: .
    container_name: php
    volumes: 
      - "./PHP-Online-Store:/var/www/html"
    depends_on:
      - mysql_db

mysql_db:
  image: mysql:latest
  container_name: mysql_db
  restart: always
  environment: 
    MYSQL_DATABASE: ecommerce
    MYSQL_ROOT_PASSWORD: rootpassword
  ports:
    - "3306:3306"
  volumes:
    - mysql:/var/lib/data/mysql

apache:
  image: apache:latest
  build: .
  container_name: apache
  depends_on:
    - mysql_db
  ports:
    - "8080:80"
  volumes:
    - "./PHP-Online-Store:/var/www/html"

volumes:
  mysql: