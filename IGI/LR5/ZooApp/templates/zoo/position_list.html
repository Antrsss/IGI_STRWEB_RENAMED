<h1>Должности сотрудников</h1>
<a href="{% url 'position_create' %}">Добавить новую должность</a>
<ul>
{% for position in positions %}
    <li>
        {{ position.name }}
        <a href="{% url 'position_detail' position.pk %}">Просмотр</a>
        <a href="{% url 'position_update' position.pk %}">Редактировать</a>
        <a href="{% url 'position_delete' position.pk %}">Удалить</a>
    </li>
{% endfor %}
</ul>
