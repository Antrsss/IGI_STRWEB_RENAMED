<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Edit Animal: {{ animal.name }}</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        .form-container {
            background-color: #f5f5f5;
            padding: 20px;
            border-radius: 5px;
            max-width: 800px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input[type="text"], 
        input[type="date"], 
        select, 
        textarea {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box;
        }
        input[type="submit"], button, a.button {
            background-color: #4CAF50;
            color: white;
            padding: 10px 15px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin-right: 10px;
            text-decoration: none;
            display: inline-block;
        }
        .photo-thumbnail {
            max-width: 200px;
            max-height: 200px;
            display: block;
            margin-top: 10px;
        }
        .messages {
            margin: 20px 0;
        }
        .alert {
            padding: 10px;
            margin-bottom: 15px;
            border-radius: 4px;
        }
        .alert-success {
            background-color: #dff0d8;
            color: #3c763d;
        }
        .alert-error {
            background-color: #f2dede;
            color: #a94442;
        }
    </style>
</head>
<body>
    <h1>Edit Animal: {{ animal.name }}</h1>
    
    {% if messages %}
    <div class="messages">
        {% for message in messages %}
        <div class="alert alert-{{ message.tags }}">{{ message }}</div>
        {% endfor %}
    </div>
    {% endif %}
    
    <div class="form-container">
        <form method="POST" enctype="multipart/form-data">
            {% csrf_token %}
            
            <div class="form-group">
                <label for="name">Name:</label>
                <input type="text" id="name" name="name" value="{{ animal.name }}" required>
            </div>
            
            <div class="form-group">
                <label for="family">Family:</label>
                <select id="family" name="family" required>
                    <option value="">Select family</option>
                    {% for family in families %}
                        <option value="{{ family.id }}" 
                            {% if animal.family and animal.family.id == family.id %}selected{% endif %}>
                            {{ family.name }}
                        </option>
                    {% endfor %}
                </select>
            </div>
            
            <div class="form-group">
                <label for="room">Room:</label>
                <select id="room" name="room">
                    <option value="">Select room</option>
                    {% for room in rooms %}
                        <option value="{{ room.id }}" 
                            {% if animal.room and animal.room.id == room.id %}selected{% endif %}>
                            {{ room.name }} (№{{ room.number }})
                        </option>
                    {% endfor %}
                </select>
            </div>
            
            <div class="form-group">
                <label for="food_type">Food Type:</label>
                <select id="food_type" name="food_type">
                    <option value="">Select food type</option>
                    {% for food_type in food_types %}
                        <option value="{{ food_type.id }}" 
                            {% if animal.food_type and animal.food_type.id == food_type.id %}selected{% endif %}>
                            {{ food_type.food_name }}
                        </option>
                    {% endfor %}
                </select>
            </div>
            
            <div class="form-group">
                <label for="country">Country:</label>
                <select id="country" name="country">
                    <option value="">Select country</option>
                    {% for country in countries %}
                        <option value="{{ country.id }}" 
                            {% if animal.country and animal.country.id == country.id %}selected{% endif %}>
                            {{ country.name }}
                        </option>
                    {% endfor %}
                </select>
            </div>
            
            <div class="form-group">
                <label for="employee">Employee:</label>
                <select id="employee" name="employee">
                    <option value="">Select employee</option>
                    {% for employee in employees %}
                        <option value="{{ employee.id }}" 
                            {% if animal.employee and animal.employee.id == employee.id %}selected{% endif %}>
                            {{ employee.name }}
                        </option>
                    {% endfor %}
                </select>
            </div>
            
            <div class="form-group">
                <label for="recepient_date">Receipt Date:</label>
                <input type="date" id="recepient_date" name="recepient_date" 
                    value="{{ animal.receipt_date|date:'Y-m-d' }}">
            </div>
            
            <div class="form-group">
                <label for="birthday">Birthday:</label>
                <input type="date" id="birthday" name="birthday" 
                    value="{{ animal.birthday|date:'Y-m-d' }}">
            </div>
            
            <div class="form-group">
                <label for="facts">Facts:</label>
                <textarea id="facts" name="facts" rows="4">{{ animal.facts }}</textarea>
            </div>
            
            <div class="form-group">
                <label for="photo">Photo:</label>
                <input type="file" id="photo" name="photo">
                {% if animal.photo %}
                    <img src="{{ animal.photo.url }}" class="photo-thumbnail">
                    <label>
                        <input type="checkbox" name="photo-clear"> Remove current photo
                    </label>
                {% endif %}
            </div>
            
            <input type="submit" value="Save Changes">
            <a href="/animals/" class="button">Cancel</a>
        </form>
    </div>
</body>
</html>
