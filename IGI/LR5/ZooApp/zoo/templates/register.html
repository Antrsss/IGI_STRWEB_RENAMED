<!DOCTYPE html>
<html>
<head>
    <title>Registration {% if role %}({{ role }}){% endif %}</title>
</head>
<body>
    <h2>Registration {% if role %}({{ role }}){% endif %}</h2>
    <form method="post">
        {% csrf_token %}
        
        {% for field in form %}
            <div>
                <label>{{ field.label_tag }}</label>
                {{ field }}
                {% if field.help_text %}
                    <small>{{ field.help_text }}</small>
                {% endif %}
                {% for error in field.errors %}
                    <div style="color: red;">{{ error }}</div>
                {% endfor %}
            </div>
        {% endfor %}
        
        <button type="submit">Register</button>
    </form>
    <p>Already have an account? <a href="{% url 'login' %}">Log in</a></p>
</body>
</html>
