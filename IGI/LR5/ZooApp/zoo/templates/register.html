<!DOCTYPE html>
<html>
<head>
    <title>Регистрация {% if role %}({{ role }}){% endif %}</title>
</head>
<body>
    <h2>Регистрация {% if role %}({{ role }}){% endif %}</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Зарегистрироваться</button>
    </form>
    <p>Уже есть аккаунт? <a href="{% url 'login' %}">Войдите</a></p>
</body>
</html>
