<h2>Your Cart</h2>
{% if cart.items.all %}
<table>
    <tr>
        <th>Ticket</th>
        <th>Quantity</th>
        <th>Total</th>
        <th>Actions</th>
    </tr>
    {% for item in cart.items.all %}
    <tr>
        <td>{{ item.ticket_type.name }}</td>
        <td>{{ item.quantity }}</td>
        <td>{{ item.total_price }}</td>
        <td>
            <a href="{% url 'add_to_cart' item.ticket_type.id %}">+</a>
            <!-- уменьшить / удалить можно аналогично -->
        </td>
    </tr>
    {% endfor %}
</table>
<p><strong>Total: {{ cart.total_price }}</strong></p>
<a href="{% url 'checkout' %}"><button>Checkout</button></a>
{% else %}
<p>Your cart is empty</p>
{% endif %}
