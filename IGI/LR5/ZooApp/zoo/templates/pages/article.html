<h1>Articles</h1>

{% for article in articles %}
    <div>
        <h2>{{ article.title }}</h2>
        <p>{{ article.short_description }}</p>
        {% if article.image %}
            <img src="{{ article.image.url }}" alt="{{ article.title }}" width="300">
        {% endif %}
        <p>{{ article.full_text }}</p>
        <p>{{ article.pub_date }}</p>
    </div>
{% empty %}
    <p>No articles available.</p>
{% endfor %}
