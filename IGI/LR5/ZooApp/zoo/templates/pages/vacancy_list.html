<head>
    <title>Vacancies</title>
</head>
<body>
    <h1>Job Vacancies</h1>

    <dl>
        {% for vacancy in vacancies %}
            <hr>
            <dt><strong>{{ vacancy.title }}</strong></dt>
            <dd>{{ vacancy.description }}</dd>
            <p><em>Requirements:</em> {{ vacancy.requirements }}<br>
            <em>Salary:</em> {{ vacancy.salary }}<br>
            <em>Posted on:</em> {{ vacancy.created_at }}</p>
        {% endfor %}
    </dl>  
</body>
