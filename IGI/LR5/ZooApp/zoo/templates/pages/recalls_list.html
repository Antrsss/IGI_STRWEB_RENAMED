<!DOCTYPE html>
<html>
<head>
    <title>Recalls</title>
</head>
<body>
    <h1>Recalls List</h1>

    {% for recall in recalls %}
        <hr>
        <h4>{{ recall.author_name }} - {{ recall.rating }}/5</h4>
        {{ recall.text }}<br>
        <small>Published on: {{ recall.pub_date|date:"Y-m-d H:i" }}</small>
    {% empty %}
        <p>No recalls yet.</p>
    {% endfor %}

    <p>
        {% if user_authenticated %}
            <a href="{% url 'recall_create' %}" target="_blank">Leave Recall</a>
        {% else %}
            <a href="{% url 'login' %}?next={% url 'recall_create' %}">Leave Recall</a>
        {% endif %}
    </p>

</body>
</html>
